[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "24"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["@napi-rs/canvas", "pdfjs-dist", "sharp"]
included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs", "node_modules/pdfjs-dist/standard_fonts/**", "node_modules/pdfjs-dist/cmaps/**"]

[dev]
command = "npm run dev"
targetPort = 3000
port = 8888

[[plugins]]
package = "@netlify/plugin-nextjs"
